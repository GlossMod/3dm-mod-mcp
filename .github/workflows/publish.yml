name: Publish to PyPI

on:
  release:
    types: [published]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - run: python -m pip install build packaging twine
      - name: Use the published tag as the package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: python
        run: |
          import os
          from packaging.version import Version

          version = Version(os.environ["RELEASE_TAG"])
          if version.local is not None:
              raise SystemExit("PyPI release tags cannot contain a local version (+...)")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              print(f"SETUPTOOLS_SCM_PRETEND_VERSION_FOR_3DM_MOD_MCP={version}", file=env)
      - name: Build and check distributions
        run: |
          python -m build
          python -m twine check --strict dist/*
      - name: Verify installed version and CLI entry point
        run: |
          python -m pip install dist/*.whl
          python -I - <<'PY'
          import os
          from importlib.metadata import distribution

          package = distribution("3dm-mod-mcp")
          assert package.version == os.environ["SETUPTOOLS_SCM_PRETEND_VERSION_FOR_3DM_MOD_MCP"]
          command, = package.entry_points.select(group="console_scripts", name="3dm-mod-mcp")
          assert callable(command.load())
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/3dm-mod-mcp/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
